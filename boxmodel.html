<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box Model</title>

    <style>
        body {
            background-color: lightgray;
        }

        .box {
            width: 200px;
            height: 100px;

            /* 1. Content */
            
            background-color: lightblue;
            padding: 30px;
            /* 2. Padding */

            /* 3. Border */
            border: 10px solid blue;

            /* 4. Margin */
            margin: 50px;
        }
    </style>
</head>

<body>

    <div class="box">
        Hello! I am the content.
    </div>

</body>
</html>
