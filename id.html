<!--Create a simple div with an id 'box'. Add text content and set its background color to blue.-->
<!--Create 3 headings (h1, h2, h3). Give them all a class 'heading' and set their color to red.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            padding: 10px;
            margin: 10px;
        }
        #box{
            background-color: blue;
        }
        .heading{
            color: red;
        }
    </style>
</head>
<body>
   
    <div id="box">
        HI I AM A DIV BOX WITH ID BOX AND THIS IS MY CONTENT FOR YOU!
    </div>
 <hr>
 <hr>
  <h1 class="heading">FIRST HEADING</h1>
  <h2 class="heading">SECOND HEADING</h2>
  <h3 class="heading">THIRD HEADING</h3>
</body>
</html>
