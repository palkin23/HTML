<!--Create a centered heading with all its text capitalized by default
 using text-transform, and set the document font to 'Times New Roman'.-->
 <!DOCTYPE html>
 <html lang="en">
 <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
             font-family: 'Times New Roman';
        }
        h1{
            text-align: center;
            text-transform: uppercase;
        }
    </style>
 </head>
 <body>
    <h1>Centred Heading</h1>
 </body>
 </html>
