<!--Create a div with a height and width of 100px. 
Set its background color to green and make it perfectly circular using border-radius.-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div</title>
    <style>
  div{
    height: 100px;
    width: 100px;
    background-color: green;
    border-radius: 50%;
  }
    </style>
</head>
<body>
    <div></div>
</body>
</html>
