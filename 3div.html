<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webpage Layout</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing:border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }

        .header {
            border: 2px solid black;
            background-color: lightblue;
            text-align: center;
            padding: 20px;
            margin: 10px;
        }

        .content {
            border: 2px solid black;
            margin: 10px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }

        .block {
            border: 2px solid black;
            background-color: lightgreen;
            width: 30%;
            height: 200px;
            text-align: center;
            line-height: 200px;
            font-weight: bold;
        }

        .footer {
            border: 2px solid black;
            background-color: lightcoral;
            text-align: center;
            padding: 20px;
            margin: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Header</h1>
    </div>

    <div class="content">
        <div class="block">Block 1</div>
        <div class="block">Block 2</div>
        <div class="block">Block 3</div>
    </div>

    <div class="footer">
        <h2>Footer</h2>
    </div>

</body>
</html>
