<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Understanding Units</title>
    <style>
        
        body{
            background-color: floralwhite;
        }
        .viewcode{
           width: 20vw;
           height: 20vh;
            background-color: chartreuse;
            text-align: center;
        }
        .view{
            margin: 0%;
            padding: 0%;
            width: 50%;
            height: 50%;
            background-color: blue;
            text-align: center;
        }
        .rem{
            width: 16rem;
            height: 16rem;
            background-color: aqua;
            text-align: center;
        }
        .pixels{
            width: 250px;
            height: 250px;
            background-color: cadetblue;
            text-align: center;
        }
        .em{
            background-color: crimson;
            width: 10em ;
            height: 10em;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="viewcode">
        <div class="view">Viewcode</div>
    </div>
    <div class="rem">REM</div>
    <div class="em">Em</div>
     <div class="pixels">PIXEL</div>
</body>
</html>
