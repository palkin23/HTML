<input type="password" name="password" id="mypassword" placeholder="enter password" required>

<!--Create a contact form combining text, email and message fields.-->
<div style="background-color: lightpink;">
<h2>Contact Form</h2>
<form action="">
    <label for="name">Name</label>
    <input type="text" name="name" id="name" >
    <br><br>
    <label for="email">Email</label>
    <input type="email" name="email" id="email" >
    <br><br>
    <label for="contact">Contact</label>
    <input type="number" name="contact" id="contact" >
    <br><br>
    <label for="message">Your Message</label>
   <br> <textarea name="message" id="message" vale="message"></textarea>
    <br>
    <br><br> <button style="background-color: blueviolet ; border-radius: 10rem;">Submit</button>
 <button style="background-color: blueviolet ; border-radius: 10rem;">Reset</button>
</form>
</div>
