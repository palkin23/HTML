</head>
<body>
    <!--Create a form with checkboxes for selecting hobbies.-->
    <p>Select Hobbies</p>

<label for="games">Games</label>

<input type="checkbox" name="hobby"  id="books" value="books">
<label for="books">Books</label>

<label for="tv">Tv</label>
<br>
<input type="checkbox" name="hobby"  id="drawing" value="drawing">
<label for="drawing">Drawing</label>
<br>

<input type="submit">
</form>
</body>
</html>
