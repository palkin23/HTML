<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Box Sizing</title>

    <style>
        .box {
            width: 300px;
            height: 100px;
            padding: 20px;
            border: 10px solid red;
            margin: 20px;
        }

        .content-box {
            box-sizing: content-box;
            }

        .border-box {
            box-sizing: border-box;
        }
    </style>
</head>

<body>

    <h2>Content Box</h2>

    <div class="box content-box">
        This is content-box
    </div>


    <h2>Border Box</h2>

    <div class="box border-box">
        This is border-box
    </div>

</body>
</html>
